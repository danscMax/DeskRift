name: 💡 Идея / Feature request
description: Чего не хватает / Something is missing
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Что сейчас не получается / What you can't do today
      description: |
        Расскажите про саму ситуацию, а не про то, как её решить. Так больше шансов,
        что найдётся вариант лучше первого пришедшего в голову.
        *Describe the situation rather than the solution — that leaves room for a better
        answer than the first one that came to mind.*
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: А как бы вы хотели / How it might work
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Как выкручиваетесь сейчас / How you work around it now
      description: Даже «никак, просто терплю» — полезный ответ / Even "I just live with it" helps
    validations:
      required: false
