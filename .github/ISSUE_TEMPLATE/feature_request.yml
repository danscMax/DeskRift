name: 💡 Идея / Feature request
description: Чего не хватает / Something is missing
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Что не получается сделать сейчас / What you can't do today
      description: |
        Опишите ситуацию, а не решение — так больше шансов, что найдётся вариант лучше
        того, что пришёл в голову первым.
        *Describe the situation rather than the solution — that leaves room for a better
        answer than the first one that came to mind.*
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Как это могло бы работать / How it might work
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Чем обходитесь сейчас / How you work around it now
      description: Даже «никак, просто терплю» — полезный ответ / Even "I just live with it" helps
    validations:
      required: false
